<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SPIDER</title>
  <desc id="desc">A geometric spider connected to graph nodes</desc>
  <defs>
    <linearGradient id="panel" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151d38"/>
      <stop offset="1" stop-color="#080c19"/>
    </linearGradient>
    <linearGradient id="signal" x1="120" y1="104" x2="400" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50e3c2"/>
      <stop offset="0.52" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#c65cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#panel)"/>
  <rect x="19" y="19" width="474" height="474" rx="111" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"/>
  <g fill="none" stroke="#7280a8" stroke-opacity=".28" stroke-width="3">
    <path d="M96 160 176 205M416 160l-80 45M80 256h104M432 256H328M104 376l84-71M408 376l-84-71"/>
  </g>
  <g fill="#10182f" stroke="url(#signal)" stroke-width="8">
    <circle cx="91" cy="156" r="17"/><circle cx="421" cy="156" r="17"/>
    <circle cx="75" cy="256" r="17"/><circle cx="437" cy="256" r="17"/>
    <circle cx="99" cy="382" r="17"/><circle cx="413" cy="382" r="17"/>
  </g>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round" stroke-width="18" filter="url(#glow)">
    <path d="M207 214 164 176 121 164M305 214l43-38 43-12"/>
    <path d="M196 250h-52l-42 6M316 250h52l42 6"/>
    <path d="m202 286-45 35-37 47M310 286l45 35 37 47"/>
    <path d="m219 310-25 61-1 30M293 310l25 61 1 30"/>
  </g>
  <ellipse cx="256" cy="278" rx="61" ry="82" fill="url(#signal)"/>
  <circle cx="256" cy="186" r="47" fill="#50e3c2"/>
  <path d="M228 184h56" stroke="#0b1123" stroke-linecap="round" stroke-width="12"/>
  <circle cx="242" cy="173" r="5" fill="#0b1123"/><circle cx="270" cy="173" r="5" fill="#0b1123"/>
</svg>
